<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Header Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Node Glow Gradients -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow filter for contrast -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      /* Dynamic Keyframe Animations */
      @keyframes dashAnim {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseAnim {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes ringPulse {
        0% { r: 16px; opacity: 0.8; }
        100% { r: 32px; opacity: 0; }
      }

      .animated-flow {
        stroke-dasharray: 8 6;
        animation: dashAnim 3s linear infinite;
      }
      .animated-flow-rev {
        stroke-dasharray: 6 5;
        animation: dashAnim 3.5s linear infinite reverse;
      }
      .pulse-node {
        transform-origin: center;
        animation: pulseAnim 3s ease-in-out infinite;
      }
      .floating-group {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .pulse-ring {
        animation: ringPulse 2.5s ease-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="340" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Hex Grid Backdrop -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1" fill="none">
    <path d="M 50,40 L 90,40 L 110,75 L 90,110 L 50,110 L 30,75 Z" />
    <path d="M 150,40 L 190,40 L 210,75 L 190,110 L 150,110 L 130,75 Z" />
    <path d="M 850,40 L 890,40 L 910,75 L 890,110 L 850,110 L 830,75 Z" />
    <path d="M 750,230 L 790,230 L 810,265 L 790,300 L 750,300 L 730,265 Z" />
    <path d="M 850,230 L 890,230 L 910,265 L 890,300 L 850,300 L 830,265 Z" />
    <path d="M 100,230 L 140,230 L 160,265 L 140,300 L 100,300 L 80,265 Z" />
  </g>

  <!-- Multi-Agent Interactive Constellation (Behind Text) -->
  <g class="floating-group">
    <!-- Connecting Active Flow Lines -->
    <path d="M 160,110 Q 300,60 500,85" fill="none" stroke="#38bdf8" stroke-width="2" class="animated-flow" opacity="0.65" />
    <path d="M 840,110 Q 700,60 500,85" fill="none" stroke="#c084fc" stroke-width="2" class="animated-flow-rev" opacity="0.65" />
    <path d="M 180,240 Q 320,280 500,250" fill="none" stroke="#34d399" stroke-width="2" class="animated-flow" opacity="0.6" />
    <path d="M 820,240 Q 680,280 500,250" fill="none" stroke="#fbbf24" stroke-width="2" class="animated-flow-rev" opacity="0.6" />
    <path d="M 160,110 C 130,170 140,200 180,240" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />
    <path d="M 840,110 C 870,170 860,200 820,240" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />

    <!-- Left Agent: Planner / Orchestrator -->
    <g transform="translate(160, 110)">
      <circle cx="0" cy="0" r="28" fill="url(#glowCyan)" />
      <circle class="pulse-ring" cx="0" cy="0" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <circle class="pulse-node" cx="0" cy="0" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e0f2fe">PLAN</text>
      <text x="0" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Planner Agent</text>
    </g>

    <!-- Right Agent: Executor / Worker -->
    <g transform="translate(840, 110)">
      <circle cx="0" cy="0" r="28" fill="url(#glowPurple)" />
      <circle class="pulse-ring" cx="0" cy="0" fill="none" stroke="#c084fc" stroke-width="1.5" />
      <circle class="pulse-node" cx="0" cy="0" r="18" fill="#0f172a" stroke="#c084fc" stroke-width="2.5" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fae8ff">EXEC</text>
      <text x="0" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Executor Agent</text>
    </g>

    <!-- Bottom Left Agent: Tool Caller -->
    <g transform="translate(180, 240)">
      <circle cx="0" cy="0" r="24" fill="url(#glowEmerald)" />
      <circle class="pulse-node" cx="0" cy="0" r="16" fill="#0f172a" stroke="#34d399" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#d1fae5">TOOL</text>
      <text x="0" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Tool Registry</text>
    </g>

    <!-- Bottom Right Agent: Evaluator / Critic -->
    <g transform="translate(820, 240)">
      <circle cx="0" cy="0" r="24" fill="url(#glowAmber)" />
      <circle class="pulse-node" cx="0" cy="0" r="16" fill="#0f172a" stroke="#fbbf24" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fef3c7">EVAL</text>
      <text x="0" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Critic / Guard</text>
    </g>
  </g>

  <!-- Foreground Backdrop Shield (Ensures 100% Readability & Contrast) -->
  <rect x="230" y="45" width="540" height="235" rx="16" fill="#030712" fill-opacity="0.65" stroke="#1e293b" stroke-width="1" filter="url(#textShadow)"/>

  <!-- Foreground Title and Content -->
  <g id="foreground-content" filter="url(#textShadow)">
    <!-- Category Mini-Badge -->
    <g transform="translate(500, 78)">
      <rect x="-120" y="-12" width="240" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" filter="url(#pillShadow)" />
      <circle cx="-100" cy="0" r="4" fill="#38bdf8" />
      <text x="5" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" letter-spacing="1.5">AUTONOMOUS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="500" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="url(#textGrad)" letter-spacing="0.5">
      Awesome Multi-Agent Systems
    </text>

    <!-- Subtitle -->
    <text x="500" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Curated Catalog of Autonomous Crews, Stateful Graph Orchestrators &amp; Agent Platforms
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(500, 222)">
      <!-- Pill 1: Role-Based Crews -->
      <g transform="translate(-165, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#pillShadow)"/>
        <text x="0" y="4.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e0f2fe">🤖 Role-Based Crews</text>
      </g>

      <!-- Pill 2: Stateful Graphs -->
      <g transform="translate(0, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" filter="url(#pillShadow)"/>
        <text x="0" y="4.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#fae8ff">⚡ Stateful Graphs</text>
      </g>

      <!-- Pill 3: Enterprise Observability -->
      <g transform="translate(165, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1.2" filter="url(#pillShadow)"/>
        <text x="0" y="4.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#d1fae5">🛡️ Observability &amp; Eval</text>
      </g>
    </g>

    <!-- Bottom Meta Line -->
    <text x="500" y="262" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">
      SaaS Platforms • Open-Source Frameworks • Autonomous Workflows
    </text>
  </g>
</svg>
